<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fichas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;700&display=swap">
    <link rel="icon" type="image/png" href="/assets/img/flavicontemporalis.png">
    <link rel="stylesheet" href="./../css/dashboard.css">
    <link rel="stylesheet" href="./../css/fichas.css">



</head>

<body onload = "listarFichas()">

    <div class="layout">
        <div class="sidebar">

            <h2>Temporalis</h2>

            <div class="links_dash">
                <a href="dashboard.html"> Estatísticas Gerais </a>


                <a href="fichas.html"> Suas Fichas </a>


                <a href="campanhas.html"> Suas Campanhas </a>


                <a href="dados.html"> Rolagens de Dados </a>


                <a class="Sair" href="#"> Sair </a>
            </div>

        </div>



        <div class="conteudo_dash">
            <div class="usuario">
                <div class="texto_usuario">
                    <h1>Fichas de RPG</h1>
                    <span> Gerencie seus personagens e suas fichas.</span>
                </div>

            </div>

           <div class="conteudo_ficha">
          
            <div class="criar_ficha">
                <div class="titulo_ficha">
                    <h2>Crie sua Ficha</h2>
                    <span>Organize sua Ficha e Monte um Escudo do Mestre para suas sessões.</span>
                </div>

                <div class="formu_ficha">
                    <div class="input">
                        <label>Nome do Personagem</label>
                        <input type="text" id = "nome_personagem"> 
                    </div>

                    <div class="input">
                        <label> Nível Dimensional: </label>
                        <input type="number" id = "nivel_dimensional"> 
                    </div>

                    <div class="input">
                        <label>Descrição do Personagem </label>
                        <textarea id = "descricao_personagem" placeholder="Escreva um resumo de suas características e motivações"></textarea>
                    </div>
                    <div id = "erro" style = "color: red"> </div>
                    <button onclick = "salvar()">Salvar Ficha</button>
                </div>
            </div> 

        
            <div class="area_cards">
                <h2>Fichas Criadas</h2>
                <div class="lista_cards" id="lista_cards">
                    
                </div>
            </div>
            
        </div> 

    </div>


</body>

</html>

<script>
    function salvar() {
        erro.innerHTML = "";

        let nomePersonagem = nome_personagem.value;
        let nivelDimensional = nivel_dimensional.value;
        let descricaoPersonagem = descricao_personagem.value;
        var id_user = sessionStorage.ID_USUARIO

        if (nomePersonagem == "" || nivelDimensional == "" || descricaoPersonagem == "") {
            erro.innerHTML = "Algum Campo em Branco, certifique-se de preencher todos os campos!"
            return;
        } 

        fetch("/fichas/salvar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                nomePersonagemServer: nomePersonagem,
                nivelDimensionalServer: nivelDimensional,
                descricaoPersonagemServer: descricaoPersonagem,
                idUserServer: id_user
            }),
        })
        .then(function (resposta) {
            console.log("resposta: ", resposta);

            if (resposta.ok) {

                listarFichas();
                

                nomePersonagem.value = "";
                nivelDimensional.value = "";
                descricaoPersonagem.value = "";
                
                
                erro.innerHTML = `<p style="color: green;">Ficha criada com sucesso!</p>`;
                
                setTimeout(() => {
                    erro.innerHTML = "";
                }, 3000);
            } else {
                throw "Houve um erro ao tentar realizar o cadastro da ficha!";
            }
        })
        .catch(function (erro) {
            console.log(`#ERRO: ${erro}`);
        });

        return false;


    }
    function editar(id_ficha) {
        window.location = `editar_ficha.html?id_ficha=${id_ficha}`;
    }
    function listarFichas() {
        var id_user = sessionStorage.ID_USUARIO;
        
        fetch(`/fichas/listar/${id_user}`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json",
            },
        })
        .then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then((fichas) => {
                    console.log("Dados recebidos do banco:", fichas);
                        
                    lista_cards.innerHTML = ""; 

                    fichas.forEach((ficha) => {
                        sessionStorage.ID_FICHA = ficha.id_ficha;
                        lista_cards.innerHTML += ` 
                        <div class="card_campanha">
                            <div class="topo_card">
                                <h3>${ficha.nome_personagem}</h3>
                            </div>
                            <div class="conteudo_card">
                                <p><strong>Nível:</strong> ${ficha.nivel}</p>
                                <p class="descricao_card">${ficha.descricao_resumida}</p>
                            </div>
                            <div class="botoes_card">
                                <button class="btn_editar" onclick = "editar(${ficha.id_ficha})">Editar Ficha</button>
                            </div>
                        </div>`;
                    });
                });
            } else {
                console.error("Erro na API ao listar fichas.");
            }
        })
        .catch(function (erro) {
            console.log(`#ERRO: ${erro}`);
        });
    }
</script>
